name: nexport-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-nexport_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-nexport_test_password}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-nexport_test}
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
